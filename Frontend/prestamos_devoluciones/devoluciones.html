<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGAS - Devolución de Equipos</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="devoluciones.css">
</head>
<body>
    <div class="container-fluid p-0">
        <div class="d-flex">
            <!-- SIDEBAR FINAL (Consistente con Racks y Auditoría) -->
            <div class="sidebar d-flex flex-column p-0">
                <h4 class="text-center mb-4 text-white fw-bold mt-3">
                    <i class="bi bi-layers"></i> Admin Panel
                </h4>
                <a href="../dashboard_administrador/dashboard.html"><i class="bi bi-grid-1x2"></i> Inicio</a>
                
                <div class="px-3 py-2 text-muted small fw-bold mt-2">INFRAESTRUCTURA</div>
                <a href="../mapa_rack/racks.html"><i class="bi bi-hdd-rack"></i> Gestión de Racks</a>
                <a href="../gestion_inventario/equipos.html"><i class="bi bi-pc-display"></i> Catálogo de Equipos</a>
                
                <div class="px-3 py-2 text-muted small fw-bold mt-2">OPERACIONES</div>
                <a href="../auditoria_QR/auditoria.html"><i class="bi bi-qr-code-scan"></i> Auditoría QR</a>
                <a href="devoluciones.html" class="active"><i class="bi bi-arrow-left-right"></i> Préstamos y Devoluciones</a>
                
                <div class="mt-auto mb-4">
                    <a href="../pantalla_login/login.html"><i class="bi bi-box-arrow-left"></i> Cerrar Sesión</a>
                </div>
            </div>

            <!-- CONTENIDO PRINCIPAL -->
            <div class="main-content flex-grow-1 p-4 bg-light">
                <h2 class="fw-bold mb-4">Devolución de Equipos</h2>

                <div class="card border-0 shadow-sm p-4 mx-auto" style="max-width: 900px;">
                    <!-- Buscador / Escáner -->
                    <div class="input-group mb-5">
                        <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 py-2" placeholder="Escanear QR del equipo a devolver">
                        <button class="btn btn-primary px-4 fw-bold">Buscar</button>
                    </div>

                    <!-- Tarjeta de Préstamo Detectado -->
                    <div class="text-center mb-4">
                        <h6 class="text-muted fw-bold mb-3">Tarjeta de Préstamo Actual</h6>
                        <div class="d-flex align-items-center justify-content-center bg-white border rounded-4 p-3 shadow-sm mx-auto" style="max-width: 500px;">
                            <img src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="User" class="rounded-circle me-3" style="width: 60px;">
                            <div class="text-start">
                                <p class="mb-0 fw-bold">Estudiante: Laura Gómez</p>
                                <p class="mb-0 text-muted small">Equipo: Nikon / Eclipse E100 (SN-83746291)</p>
                            </div>
                        </div>
                    </div>

                    <!-- Acciones Principales -->
                    <div class="row g-3 mt-4">
                        <div class="col-md-6">
                            <button class="btn btn-success w-100 py-3 fw-bold rounded-3">
                                <i class="bi bi-check2-circle me-2"></i> Devolver en Buen Estado
                            </button>
                        </div>
                        <div class="col-md-6">
                            <button class="btn btn-danger w-100 py-3 fw-bold rounded-3" data-bs-toggle="modal" data-bs-target="#modalFalla">
                                <i class="bi bi-tools me-2"></i> Reportar Daño / Falla
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE REPORTE DE FALLA (Basado en la imagen) -->
    <div class="modal fade" id="modalFalla" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light border-0">
                    <h5 class="modal-title fw-bold">Reportar Daño o Falla</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <label class="form-label small fw-bold text-muted">Describa el problema del equipo (obligatorio):</label>
                    <textarea class="form-control bg-light border-0 mb-4" rows="4" placeholder="Ingrese detalles del problema..."></textarea>
                    
                    <button class="btn btn-primary w-100 py-2 fw-bold" style="background-color: #0b5361; border: none;">
                        Confirmar Falla y Enviar a Mantenimiento
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
